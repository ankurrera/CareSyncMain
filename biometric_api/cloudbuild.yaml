# Google Cloud Build configuration for Biometric API
steps:
  # 1. Build Docker image with pre-downloaded ML models
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/biometric-api:$COMMIT_SHA', '.']

  # 2. Push image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/biometric-api:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'biometric-api'
      - '--image=gcr.io/$PROJECT_ID/biometric-api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--concurrency=10'
      - '--timeout=300s'
      - '--set-env-vars=DEEPFACE_HOME=/app'

images:
  - 'gcr.io/$PROJECT_ID/biometric-api:$COMMIT_SHA'
